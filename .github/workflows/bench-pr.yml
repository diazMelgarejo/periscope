name: Bench Gate

# Call the workflow in this repository. It matches Makefile
# bench-gate-config, which emits BENCH_GATE_COUNT and BENCH_GATE_TIME.
# kenn-io/agentsview@main no longer contains bench.yml (removed in
# agentsview #1667). The previous @main pin failed closed: while that
# file still existed it required BENCH_GATE_HEAVY under `set -u`, which
# this Makefile does not emit, and after the file was deleted the
# caller failed before any job started.
on:
  pull_request:
    # Docs/frontend-only PRs cannot change the gated Go paths. If
    # this check is ever made required on branch protection, pair it
    # with a no-op sibling workflow on the inverse paths.
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/bench.yml"
      - ".github/workflows/bench-pr.yml"
permissions: read-all

jobs:
  run:
    uses: ./.github/workflows/bench.yml
