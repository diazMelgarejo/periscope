# Periscope Workflow Add New Parser Or Provider

## Action

Follow the add-new-parser-or-provider workflow:
1. Implement parser/provider logic in internal/parser (e.g., <agent>_provider.go, <agent>.go)
2. Add/update types in internal/parser/types.go
3. Update provider registration in internal/parser/provider.go and/or provider_migration.go
4. Add test fixtures and coverage in internal/parser/testdata/<agent>/* and <agent>_test.go
5. Integrate with sync engine (internal/sync/engine.go, engine_test.go, integration_test.go)
6. Update documentation (docs/internal/session-format-sources.md, docs/configuration.md)
7. Update frontend agent utils/tests if needed (frontend/src/lib/utils/agents.ts, agents.test.ts)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: internal/parser/<agent>_provider.go, internal/parser/<agent>.go, internal/parser/types.go

